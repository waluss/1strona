version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tenderplatform-db
    environment:
      POSTGRES_USER: tenderplatform
      POSTGRES_PASSWORD: tenderplatform_password
      POSTGRES_DB: tenderplatform
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderplatform -d tenderplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tenderplatform-backend
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql://tenderplatform:tenderplatform_password@db:5432/tenderplatform
      SECRET_KEY: dev_secret_key_change_in_production
      INITIAL_ADMIN_PASSWORD: admin
      ENVIRONMENT: local
      IMPORT_DRY_RUN_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: tenderplatform-frontend
    ports:
      - "8085:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: tenderplatform-prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: tenderplatform-grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
